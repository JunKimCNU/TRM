name: Linux source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: '1.75.0'
            features: ''
          - rust: stable
            features: '--no-default-features --features rust-gzip'
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      TRM_RUN_ARCHIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Select Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component clippy
          rustup default '${{ matrix.rust }}'
      - name: Native tests and lint
        run: |
          cargo test --locked --all-targets ${{ matrix.features }}
          cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Build and install runtime and optional example tools
        run: |
          cargo build --release --locked --bin trm --examples ${{ matrix.features }}
          python3 -B scripts/install_runtime.py --from-binary target/release/trm
      - name: Portable Python tests and offline pipeline
        run: |
          python3 -B scripts/run_tests.py --quiet
          python3 -B scripts/release_smoke.py --output /tmp/trm-release-smoke
      - name: Inspect native crate contents
        run: cargo package --list --locked
